apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: 517121893325.dkr.ecr.us-east-1.amazonaws.com/frontend:1.1
        name: frontend
        ports:
        - containerPort: 80 
